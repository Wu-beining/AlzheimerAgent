[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alzheimer-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
models = ["torch>=2.2,<3", "scikit-learn>=1.3,<2", "scipy>=1.10,<2"]
imaging = ["nibabel>=5,<6", "scipy>=1.10,<2", "matplotlib>=3.7,<4"]
explain = ["shap>=0.44,<1"]
test = ["pytest>=7,<10"]

[project.scripts]
alzheimer-agent = "alzheimer_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
alzheimer_agent = ["prompts/*.txt"]
[tool.pytest.ini_options]
testpaths = ["tests"]
